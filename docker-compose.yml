services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: antisocial-backend
    restart: always
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: antisocial-frontend
    restart: always
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT:-5000}:5000"
    depends_on:
      - backend
