{% extends "base.html" %}

{% block title %}Register - Antisocial{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 2rem auto;">
  <div class="card">
    <h2 style="margin-bottom: 1.5rem; text-align: center; color: var(--primary-red);">Create Your Account</h2>

    <form method="POST" action="{{ url_for('register') }}">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" class="form-control" required placeholder="Choose a username">
        <div style="margin-top: 0.4rem; font-size: 0.82rem; color: var(--text-main); background: rgba(220, 38, 38, 0.08); padding: 0.5rem 0.75rem; border-radius: var(--radius-sm); border-left: 3px solid var(--primary-red);">
          ⚠️ <strong>Note:</strong> This username cannot be changed later and will be displayed on everything you post.
        </div>
      </div>


      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" required placeholder="your.email@example.com">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" required placeholder="Choose a strong password">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Register Account</button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
      Already have an account? <a href="{{ url_for('login') }}" style="color: var(--primary-red); font-weight: 600;">Log in</a>
    </div>
  </div>
</div>
{% endblock %}
